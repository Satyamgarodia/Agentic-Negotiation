# Cloud Build pipeline: build image -> push to GCR -> deploy to Cloud Run
# Service name: gemini-call-link
#
# REQUIRED one-time setup:
#   1. Enable APIs: Cloud Build, Cloud Run, Container Registry
#        gcloud services enable cloudbuild.googleapis.com run.googleapis.com containerregistry.googleapis.com
#   2. Grant the Cloud Build service account permission to deploy to Cloud Run:
#        PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#        gcloud projects add-iam-policy-binding $PROJECT_ID \
#          --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#          --role="roles/run.admin"
#        gcloud iam service-accounts add-iam-policy-binding \
#          $(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')-compute@developer.gserviceaccount.com \
#          --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#          --role="roles/iam.serviceAccountUser"
#   3. Set runtime secrets (NEVER bake them into the image). Either add
#      --set-secrets below, or configure them once in the console / CLI:
#        gcloud run services update gemini-call-link --region=${_REGION} \
#          --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,META_ACCESS_TOKEN=meta-token:latest
#
# Trigger with:  gcloud builds submit --config cloudbuild.yaml .
# Or connect the repo in Cloud Console -> Cloud Build -> Triggers (builds on every push).

steps:
  # 0. Pull previous image so unchanged layers (npm install) reuse cache.
  # First-ever build has nothing to pull — failure is OK.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/gemini-call-link:latest || true']
    allowFailure: true

  # 1. Build the container image (tagged with commit SHA + latest).
  # Unchanged package.json => npm install layer comes from cache (seconds).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/gemini-call-link:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gemini-call-link:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gemini-call-link:latest'
      - '.'
    timeout: 600s

  # 2. Push both tags to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gemini-call-link:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gemini-call-link:latest']

  # 3. Deploy the SHA-tagged image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gemini-call-link'
      - '--image=gcr.io/$PROJECT_ID/gemini-call-link:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--timeout=3600' # max request timeout; a call's media WebSocket lives as
        # long as the call — 300s would drop calls running past 5 minutes.
      - '--no-cpu-throttling' # keep CPU allocated during long-lived call
        # WebSockets; throttling starves realtime audio (costs a little more).
      - '--max-instances=10'
    # No --set-env-vars: non-secret config is hardcoded in server.ts.
    # Non-secret overrides only (rarely needed):
    # - '--update-env-vars=MEDIA_ANNOUNCE_IP=<UDP-reachable-IP>'
    # Secrets (set once in console, or uncomment to bind at deploy time):
    # - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,META_ACCESS_TOKEN=meta-token:latest,LIVEKIT_API_KEY=livekit-key:latest,LIVEKIT_API_SECRET=livekit-secret:latest'
    # NOTE: Cloud Run has no UDP ingress. WhatsApp RTP audio needs MEDIA_ANNOUNCE_IP
    # pointing at a UDP-capable host (LiveKit Cloud TURN / media-bridge). The Twilio
    # media-stream path (/ws/media-stream) works on Cloud Run without UDP.

substitutions:
  _REGION: us-central1 # gateway must sit next to the VM + Gemini model (all us-central1); override per-build: gcloud builds submit --substitutions=_REGION=asia-south1

timeout: 1200s

# Registers pushed images in the build record
images:
  - 'gcr.io/$PROJECT_ID/gemini-call-link:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gemini-call-link:latest'

options:
  logging: CLOUD_LOGGING_ONLY